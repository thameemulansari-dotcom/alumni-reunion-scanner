
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The New College Alumni Reunion Check-in</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 560px;
      margin: 20px auto;
      padding: 16px;
      color: #222;
    }
    h2 { color: #6b1830; }
    button {
      padding: 12px 18px;
      margin: 8px 4px 8px 0;
      background: #6b1830;
      color: white;
      border: 0;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
    #reader { width: 100%; }
    #result {
      margin-top: 16px;
      padding: 16px;
      background: #f1f1f1;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h2>Alumni Reunion Check-in</h2>
  <p>The New College · 28 November 2026</p>
  <div id="reader"></div>
  <div id="result" role="status" aria-live="polite">Ready to scan.</div>
  <button id="startBtn">Start Scanner</button>
  <button id="stopBtn">Stop Scanner</button>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbywz8qKlbYMhJSmReuPYzV_trUIQzFGJNLh6mRnvz-M2w8u1QS9r7_vQqd8Jf461S2nTg/exec";

    let scanner = null;
    let busy = false;

    const resultBox = document.getElementById("result");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");

    function show(message) {
      resultBox.textContent = message;
    }

    function checkIn(token) {
      show("QR detected. Checking registration...");

      const callbackName =
        "alumniCheckin_" + Date.now() + "_" +
        Math.random().toString(36).slice(2);

      const script = document.createElement("script");
      let finished = false;
      let timeout;

      function cleanup() {
        delete window[callbackName];
        script.remove();
        clearTimeout(timeout);
      }

      function finish(message) {
        if (finished) return;
        finished = true;
        cleanup();
        show(message);
        busy = false;

        if (scanner && scanner.isScanning) {
          try { scanner.resume(); } catch (e) {}
        }
      }

      timeout = setTimeout(function() {
        finish(
          "No response from the check-in server.\n" +
          "Check deployment access and try again."
        );
      }, 20000);

      window[callbackName] = function(data) {
        let message = data.message || "Server response received.";

if (data.name) message += "\nName: " + data.name;
if (data.id) message += "\nAlumni ID: " + data.id;

message += "\nRegistration Payment made: " +
  (data.payment || "Not provided");

message += "\nTransaction ID / Paid Reference No.: " +
  (data.transaction || "Not provided");

        if (data.ok === true) {
          message = "SUCCESS — " + message;
        } else if (data.duplicate) {
          message = "ALREADY CHECKED IN — " + message;
        } else {
          message = "CHECK-IN NOT COMPLETED — " + message;
        }

        finish(message);
      };

      script.onerror = function() {
        finish(
          "Unable to contact the check-in server.\n" +
          "Verify the web app URL, access settings, and deployment."
        );
      };

      const separator = API_URL.includes("?") ? "&" : "?";
      script.src = API_URL + separator +
        "action=checkin" +
        "&token=" + encodeURIComponent(token) +
        "&callback=" + encodeURIComponent(callbackName);

      document.body.appendChild(script);
    }

    startBtn.addEventListener("click", async function() {
      if (scanner && scanner.isScanning) return;

      try {
        if (typeof Html5Qrcode === "undefined") {
          throw new Error("QR library failed to load. Check internet access.");
        }

        if (!scanner) scanner = new Html5Qrcode("reader");

        startBtn.disabled = true;
        show("Starting camera...");

        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 230, height: 230 } },
          async function(decodedText) {
            if (busy) return;

            busy = true;
            try {
              await scanner.pause(true);
              checkIn(decodedText);
            } catch (error) {
              show("Scanner error: " + error.message);
              busy = false;
            }
          },
          function() {}
        );

        show("Camera ready. Scan an alumni QR pass.");
      } catch (error) {
        show("Scanner error:\n" + error.message);
      } finally {
        startBtn.disabled = false;
      }
    });

    stopBtn.addEventListener("click", async function() {
      try {
        if (scanner && scanner.isScanning) {
          await scanner.stop();
        }
        busy = false;
        show("Scanner stopped.");
      } catch (error) {
        show("Stop error: " + error.message);
      }
    });
  </script>
</body>
</html>
